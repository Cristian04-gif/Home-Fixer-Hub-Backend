spring:
  application:
    name: api-gateway
server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: ${EUREKA_ENABLED:true}
    fetch-registry: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true

services:
  identiy-service: ${IDENTITY_SERVICE_URL:http://localhost:8081}
  profile-service: ${PROFILE_SERVICE_URL:http://localhost:8082}
  catalog-service: ${CATALOG_SERVICE_URL:http://localhost:8083}
  booking-service: ${BOOKING_SERVICE_URL:http://localhost:8084}
  review-service: ${REVIEW_SERVICE_URL:http://localhost:8085}
